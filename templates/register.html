{% extends 'base.html' %}

{% block title %}Register - EduMind AI{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fa-solid fa-user-plus auth-icon"></i>
            <h2>Student Registration</h2>
            <p>Create an account to start your learning journey</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST" class="auth-form">
            <!-- Full Name -->
            <div class="form-group">
                <label for="full_name"><i class="fa-solid fa-user-tie"></i> Full Name</label>
                <input type="text" id="full_name" name="full_name" placeholder="Enter your full name" required minlength="2" maxlength="100">
            </div>

            <!-- Username -->
            <div class="form-group">
                <label for="username"><i class="fa-solid fa-at"></i> Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a unique username" required minlength="3" maxlength="50" pattern="^[a-zA-Z0-9_]+$" title="Only letters, numbers, and underscores allowed">
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" placeholder="student@example.com" required maxlength="120">
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required minlength="6">
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirm_password"><i class="fa-solid fa-shield-halved"></i> Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required minlength="6">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Register Account</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
        </div>
    </div>
</div>
{% endblock %}
